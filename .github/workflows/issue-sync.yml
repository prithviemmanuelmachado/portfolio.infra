name: Issue Status Sync (reusable)

# Called by a consumer repo's own workflow on pull_request events targeting
# its main branch. Scans the PR title/body and its commits for GitHub
# closing keywords (Fixes/Closes/Resolves #N) and moves each referenced
# issue's card on the shared Project (v2) board:
#   - PR opened/reopened/synchronize -> "PR raised"
#   - PR closed, merged             -> "In review"
#   - PR closed, not merged         -> "PR rejected"

on:
  workflow_call:
    inputs:
      target-branch:
        description: Base branch PRs must target for status sync to apply.
        type: string
        default: main
      project-owner:
        description: Login of the user/org that owns the Project (v2) board.
        type: string
        default: prithviemmanuelmachado
      project-number:
        description: Number of the Project (v2) board (from its URL, e.g. .../projects/3 -> 3).
        type: number
        required: true
      status-field-name:
        type: string
        default: Status
      pr-raised-option:
        type: string
        default: "PR raised"
      pr-rejected-option:
        type: string
        default: "PR rejected"
      in-review-option:
        type: string
        default: "In review"
    secrets:
      projects-token:
        description: >
          PAT with `repo` + `project` scopes. The default GITHUB_TOKEN
          cannot read/write a user- or org-level Projects (v2) board, so
          this must be a personal access token stored as a repo secret.
        required: true

jobs:
  sync:
    if: github.event.pull_request.base.ref == inputs.target-branch
    runs-on: ubuntu-latest
    steps:
      - name: Find issues referenced via closing keywords
        id: refs
        uses: actions/github-script@v7
        with:
          script: |
            const keywordRe = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
            const pr = context.payload.pull_request;
            const texts = [pr.title || "", pr.body || ""];

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });
            for (const c of commits) texts.push(c.commit.message || "");

            const issues = new Set();
            for (const text of texts) {
              let m;
              while ((m = keywordRe.exec(text)) !== null) issues.add(Number(m[1]));
            }

            const list = [...issues];
            core.info(`Referenced issues: ${list.join(", ") || "(none)"}`);
            core.setOutput("issues", JSON.stringify(list));

      - name: Determine target status
        id: status
        run: |
          if [ "${{ github.event.action }}" = "closed" ]; then
            if [ "${{ github.event.pull_request.merged }}" = "true" ]; then
              echo "status=${{ inputs.in-review-option }}" >> "$GITHUB_OUTPUT"
            else
              echo "status=${{ inputs.pr-rejected-option }}" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "status=${{ inputs.pr-raised-option }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Move referenced issues on the project board
        if: steps.refs.outputs.issues != '[]'
        uses: actions/github-script@v7
        env:
          ISSUES_JSON: ${{ steps.refs.outputs.issues }}
          TARGET_STATUS: ${{ steps.status.outputs.status }}
          PROJECT_OWNER: ${{ inputs.project-owner }}
          PROJECT_NUMBER: ${{ inputs.project-number }}
          FIELD_NAME: ${{ inputs.status-field-name }}
        with:
          github-token: ${{ secrets.projects-token }}
          script: |
            const issues = JSON.parse(process.env.ISSUES_JSON);
            const owner = process.env.PROJECT_OWNER;
            const projectNumber = Number(process.env.PROJECT_NUMBER);
            const fieldName = process.env.FIELD_NAME;
            const targetStatus = process.env.TARGET_STATUS;

            const { user } = await github.graphql(
              `query($owner: String!, $number: Int!, $fieldName: String!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                    field(name: $fieldName) {
                      ... on ProjectV2SingleSelectField { id options { id name } }
                    }
                  }
                }
              }`,
              { owner, number: projectNumber, fieldName }
            );

            const project = user.projectV2;
            if (!project) core.setFailed(`Project #${projectNumber} not found for user ${owner}`);
            const field = project.field;
            if (!field) core.setFailed(`Field "${fieldName}" not found on project #${projectNumber}`);

            const option = field.options.find((o) => o.name === targetStatus);
            if (!option) {
              core.setFailed(
                `Status option "${targetStatus}" not found on field "${fieldName}". ` +
                `Available options: ${field.options.map((o) => o.name).join(", ")}`
              );
              return;
            }

            for (const issueNumber of issues) {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              const contentId = issue.node_id;

              let itemId;
              try {
                const added = await github.graphql(
                  `mutation($projectId: ID!, $contentId: ID!) {
                    addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                      item { id }
                    }
                  }`,
                  { projectId: project.id, contentId }
                );
                itemId = added.addProjectV2ItemById.item.id;
              } catch (e) {
                // Already on the board — find its existing item id.
                let cursor = null;
                do {
                  const page = await github.graphql(
                    `query($projectId: ID!, $cursor: String) {
                      node(id: $projectId) {
                        ... on ProjectV2 {
                          items(first: 100, after: $cursor) {
                            pageInfo { hasNextPage endCursor }
                            nodes { id content { ... on Issue { id } } }
                          }
                        }
                      }
                    }`,
                    { projectId: project.id, cursor }
                  );
                  const items = page.node.items;
                  const match = items.nodes.find((n) => n.content && n.content.id === contentId);
                  if (match) { itemId = match.id; break; }
                  cursor = items.pageInfo.hasNextPage ? items.pageInfo.endCursor : null;
                } while (cursor);
                if (!itemId) throw e;
              }

              await github.graphql(
                `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                    value: { singleSelectOptionId: $optionId }
                  }) { projectV2Item { id } }
                }`,
                { projectId: project.id, itemId, fieldId: field.id, optionId: option.id }
              );
              core.info(`Issue #${issueNumber} -> "${targetStatus}"`);
            }
